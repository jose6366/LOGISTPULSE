<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>LOGISTPULSE</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><nav><span class="brand">LOGISTPULSE</span><a href="/">Pedidos</a><a href="/orders/new">Nuevo pedido</a><form th:action="@{/logout}" method="post"><button>Salir</button></form></nav><main><div th:if="${success}" class="success" th:text="${success}"></div><div th:if="${error}" class="error" th:text="${error}"></div><h1>Panel logístico</h1><div class="card"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Destino</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="o:${orders}"><td th:text="${o.orderNumber}"></td><td th:text="${o.customerName}"></td><td th:text="${o.destination}"></td><td><span class="badge" th:text="${o.status}"></span></td><td><a th:href="@{'/orders/'+${o.id}}">Detalle</a></td></tr></tbody></table></div></main></body></html>
