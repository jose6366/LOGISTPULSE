server:
  port: ${APP_PORT:8081}
spring:
  application:
    name: logistpulse
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistpulse}
    username: ${DB_USER:logistpulse}
    password: ${DB_PASSWORD:logistpulse_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
